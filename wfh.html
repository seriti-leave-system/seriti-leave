<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work from home - Seriti Institute</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#0B6E3F; --brand-deep:#003F22; --brand-light:#17874F; --brand-pale:#EAF5EE;
  --slate:#2B2B2B; --slate-soft:#5C6670;
  --green:#1E8449; --green-pale:#E9F7EF;
  --amber:#B7770D; --amber-pale:#FEF9E7;
  --red:#C0392B; --red-pale:#FDEDEC;
  --line:#DFE7E1; --paper:#F6F9F7; --white:#FFFFFF;
  --radius:12px; --shadow:0 4px 20px rgba(11,110,63,0.08);
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:'Inter',sans-serif; background:var(--paper); color:var(--slate);}
h1,h2,h3{font-family:'Outfit',sans-serif; font-weight:700; letter-spacing:-0.01em;}
.nav{background:linear-gradient(135deg, var(--brand), var(--brand-deep)); color:#fff; padding:0 24px; display:flex; align-items:center; justify-content:space-between; height:58px;}
.nav-logo-img{height:24px; filter:brightness(0) invert(1);}
.nav-right{display:flex; align-items:center; gap:16px; flex-wrap:wrap; justify-content:flex-end;}
.nav-name{font-size:13.5px; color:rgba(255,255,255,0.9);}
.nav-btn{font-size:12.5px; font-weight:600; color:rgba(255,255,255,0.75); cursor:pointer; background:none; border:none; padding:0;}
.nav-btn:hover{color:#fff;}
.wrap{max-width:1000px; margin:28px auto 60px; padding:0 20px;}
.head h1{font-size:24px;}
.head p{color:var(--slate-soft); font-size:14px; margin-top:4px;}
.tabs{display:flex; gap:8px; margin:22px 0 18px; flex-wrap:wrap;}
.tab{font-family:'Inter',sans-serif; font-size:13.5px; font-weight:600; padding:9px 16px; border-radius:999px; border:1px solid var(--line); background:var(--white); color:var(--slate-soft); cursor:pointer;}
.tab.active{background:var(--brand); border-color:var(--brand); color:#fff;}
.tab .count{display:inline-block; margin-left:6px; min-width:20px; padding:1px 6px; border-radius:999px; background:var(--amber); color:#fff; font-size:11.5px; text-align:center;}
.panel{display:none;}
.panel.show{display:block;}
.card{background:var(--white); border:1px solid var(--line); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); margin-bottom:18px;}
.card h2{font-size:17px; margin-bottom:6px;}
.card .sub{color:var(--slate-soft); font-size:13.5px; line-height:1.5;}
.notice{background:var(--amber-pale); border-left:4px solid var(--amber); color:#7A5000; padding:12px 14px; border-radius:8px; font-size:13.5px; line-height:1.5;}
.notice.ok{background:var(--green-pale); border-left-color:var(--green); color:#145A32;}
.notice.err{background:var(--red-pale); border-left-color:var(--red); color:#922B21;}
.daypick{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin:16px 0;}
.dayopt{display:flex; align-items:center; gap:10px; padding:14px; border:2px solid var(--line); border-radius:10px; cursor:pointer; background:var(--white); font-size:14px; font-weight:600;}
.dayopt input{width:18px; height:18px; accent-color:var(--brand);}
.dayopt small{display:block; font-weight:400; color:var(--slate-soft); font-size:12.5px;}
.dayopt.on{border-color:var(--brand); background:var(--brand-pale);}
.dayopt.off{opacity:.5; cursor:not-allowed;}
.btn{font-family:'Inter',sans-serif; font-size:14px; font-weight:600; padding:10px 18px; border-radius:8px; border:none; cursor:pointer; background:var(--brand); color:#fff;}
.btn:disabled{opacity:.5; cursor:not-allowed;}
.btn.ghost{background:var(--white); color:var(--slate-soft); border:1px solid var(--line);}
.btn.red{background:var(--red);}
.btn.small{font-size:12.5px; padding:6px 12px;}
table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{text-align:left; font-size:12px; color:var(--slate-soft); padding:8px 10px; border-bottom:2px solid var(--line);}
td{padding:10px; border-bottom:1px solid var(--line); vertical-align:top;}
.badge{display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:600;}
.b-Pending{background:var(--amber-pale); color:var(--amber);}
.b-Approved{background:var(--green-pale); color:var(--green);}
.b-Declined{background:var(--red-pale); color:var(--red);}
.b-Cancelled{background:#EEF1EF; color:var(--slate-soft);}
.weeksw{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
.cols{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px;}
.col{background:var(--white); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow);}
.col h3{font-size:14px; padding:12px 14px; background:var(--brand-pale); color:var(--brand-deep);}
.col h3 span{font-weight:400; color:var(--slate-soft); font-size:12.5px; margin-left:6px;}
.col ul{list-style:none; padding:6px 0; min-height:60px;}
.col li{padding:8px 14px; font-size:14px; border-bottom:1px solid #F0F3F1;}
.col li small{display:block; color:var(--slate-soft); font-size:12px;}
.col .none{padding:14px; color:var(--slate-soft); font-size:13px;}
.find{width:100%; padding:11px 14px; border:1px solid var(--line); border-radius:8px; font-size:14px; font-family:'Inter',sans-serif; margin-bottom:14px;}
.foot{color:var(--slate-soft); font-size:12.5px; margin-top:14px; line-height:1.5;}
.req{border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px; background:var(--white);}
.req .top{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; font-size:14px;}
.req textarea{width:100%; margin:10px 0; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-family:'Inter',sans-serif; font-size:13.5px; resize:vertical;}
.loading{color:var(--slate-soft); font-size:14px; padding:20px 0;}
.msg{margin:12px 0;}
@media(max-width:560px){ .nav{padding:0 14px;} .wrap{padding:0 14px;} table{font-size:12.5px;} }
</style>
</head>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw9hzr_FHyzN-SXSmOhG7aBUIF84PpOX44yhBn_dC9QSwCAqjKzHRDyGkLtZAh2XgX5Zg/exec";
const SESSION_TTL_MS = 12 * 60 * 60 * 1000; // 12 hours, same window as the other pages

function loadSeritiSession(){
  let raw = sessionStorage.getItem('seriti_user');
  if(raw){ try{ return JSON.parse(raw); }catch(e){} }
  raw = localStorage.getItem('seriti_user');
  if(!raw) return null;
  try{
    const stored = JSON.parse(raw);
    if(!stored.savedAt || (Date.now() - stored.savedAt) > SESSION_TTL_MS){ localStorage.removeItem('seriti_user'); return null; }
    stored.savedAt = Date.now();
    sessionStorage.setItem('seriti_user', JSON.stringify(stored));
    localStorage.setItem('seriti_user', JSON.stringify(stored));
    return stored;
  }catch(e){ return null; }
}
const user = loadSeritiSession();
if(!user){ sessionStorage.setItem('seriti_return_to','wfh.html' + (window.location.hash || '')); window.location.href='login.html'; }

function signOut(){
  try{ localStorage.removeItem('seriti_wfh_' + (user && user.email ? user.email : '')); }catch(e){}
  try{ localStorage.removeItem('seriti_dash_' + (user && user.email ? user.email : '')); }catch(e){}
  sessionStorage.removeItem('seriti_user');
  localStorage.removeItem('seriti_user');
  window.location.href='login.html';
}
function escH(s){ const d=document.createElement('div'); d.textContent=(s==null?'':s); return d.innerHTML; }
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r=>setTimeout(r,ms));

if(user){
  $('navName').textContent = user.name || '';
  const ab = $('approvalsBtn');
  if(user.role==='hr'){ ab.textContent='HR page'; ab.onclick=()=>window.location.href='hr.html'; ab.style.display=''; }
  else if(user.role==='manager'){ ab.textContent='Leave approvals'; ab.onclick=()=>window.location.href='manager.html'; ab.style.display=''; }
}

/* ---------- date helpers (plain YYYY-MM-DD, no timezone surprises) ---------- */
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOWL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DAYKEYS = ['Tue','Wed','Thu'];
const DAYLONG = {Tue:'Tuesday', Wed:'Wednesday', Thu:'Thursday'};
const DAYOFF = {Tue:1, Wed:2, Thu:3};
function parts(ymd){ return ymd.split('-').map(Number); }
function addDays(ymd,n){ const p=parts(ymd); const d=new Date(Date.UTC(p[0],p[1]-1,p[2]+n)); return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0'); }
function dow(ymd){ const p=parts(ymd); return new Date(Date.UTC(p[0],p[1]-1,p[2])).getUTCDay(); }
function shortDate(ymd){ const p=parts(ymd); return p[2]+' '+MON[p[1]-1]; }
function longDate(ymd){ const p=parts(ymd); return DOWL[dow(ymd)]+' '+p[2]+' '+MONL[p[1]-1]; }
function weekLabel(ws){ const e=addDays(ws,4); return shortDate(ws)+' to '+shortDate(e)+' '+parts(e)[0]; }
function dayDate(ws,k){ return DAYLONG[k]+' '+shortDate(addDays(ws,DAYOFF[k])); }

/* ---------- loading (read only, so a quick automatic retry is safe) ---------- */
let DATA = null;
async function fetchData(){
  const url = SCRIPT_URL + '?action=wfh&email=' + encodeURIComponent(user.email) + '&hash=' + encodeURIComponent(user.hash);
  let last = null;
  for(let attempt=1; attempt<=3; attempt++){
    try{
      const res = await fetch(url);
      const data = JSON.parse(await res.text());
      return data;
    }catch(e){ last = e; if(attempt<3) await sleep(1200*attempt); }
  }
  throw last;
}
/* A copy of the last page is kept on this device (for today only) so the page can
   open straight away while the fresh information is fetched. It is removed on sign-out. */
function wfhCacheKey(){ return 'seriti_wfh_' + (user && user.email ? user.email : ''); }
function wfhDayStamp(){ const d = new Date(); return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate(); }
function readWfhCache(){
  try{
    const c = JSON.parse(localStorage.getItem(wfhCacheKey()) || 'null');
    if(c && c.data && c.day === wfhDayStamp()) return c.data;
  }catch(e){}
  return null;
}
function writeWfhCache(data){
  try{ localStorage.setItem(wfhCacheKey(), JSON.stringify({ savedAt: Date.now(), day: wfhDayStamp(), data })); }catch(e){}
}
function clearWfhCache(){ try{ localStorage.removeItem(wfhCacheKey()); }catch(e){} }
function userIsTyping(){
  return !!document.querySelector('#panel-apply input:checked, #panel-team textarea:not(:placeholder-shown)');
}
let SHOWED_CACHE = false;
async function refresh(){
  try{
    const data = await fetchData();
    if(data.error){ clearWfhCache(); SHOWED_CACHE = false; $('loadMsg').style.display=''; $('loadMsg').innerHTML = '<div class="notice err">' + escH(data.error) + ' Please sign in again.</div>'; return false; }
    DATA = data; writeWfhCache(data); $('loadMsg').style.display='none';
    if(!(SHOWED_CACHE && userIsTyping())) renderAll();
    SHOWED_CACHE = false;
    return true;
  }catch(e){
    if(SHOWED_CACHE){ SHOWED_CACHE = false; return false; } /* keep showing the saved page */
    $('loadMsg').style.display='';
    $('loadMsg').innerHTML = '<div class="notice err">Could not load the page. <a href="#" onclick="initialLoad();return false;">Try again</a><br><small>Reason: ' + escH(e && e.message ? e.message : e) + '</small></div>';
    return false;
  }
}

/* ---------- tabs ---------- */
let CURRENT_TAB = null;
function showTab(t){
  CURRENT_TAB = t;
  ['who','apply','team'].forEach(x=>{ $('panel-'+x).classList.toggle('show', x===t); $('tabBtn-'+x).classList.toggle('active', x===t); });
}
function existingFor(ws){ return DATA.mine.find(r=>r.weekStart===ws && (r.status==='Pending'||r.status==='Approved')); }

function renderAll(){
  const d = DATA;
  $('wfhOverviewBtn').style.display = d.me.canOverview ? '' : 'none';
  const pend = d.team.filter(r=>r.status==='Pending').length;
  $('tabBtn-team').style.display = d.me.isManager ? '' : 'none';
  $('tabBtn-apply').style.display = d.me.eligible ? '' : 'none';
  $('subtitle').textContent = d.me.eligible ? 'Let your colleagues know which days you are working from home. This does not use any of your leave.' : 'See which colleagues are working from home this week and next week.';
  const c = $('teamCount'); c.style.display = pend ? '' : 'none'; c.textContent = pend;
  renderWho(); renderApply(); renderMine(); renderTeam();
  if(CURRENT_TAB===null){
    const h = (window.location.hash||'').replace('#','');
    let t = 'who';
    if(h==='team' && d.me.isManager) t='team';
    else if(h==='apply' && d.me.eligible) t='apply';
    else if(h==='who') t='who';
    else if(d.me.eligible && d.window.open && !existingFor(d.window.weekStart)) t='apply';
    showTab(t);
  } else if(CURRENT_TAB==='team' && !d.me.isManager){ showTab('who'); }
  else showTab(CURRENT_TAB);
}

/* ---------- who is working from home ---------- */
let WHO_WEEK = 0;
function renderWho(){
  if(!DATA) return;
  const q = ($('findBox').value||'').trim().toLowerCase();
  const weeks = DATA.weeks;
  let html = '';
  if(q){
    const people = {};
    weeks.forEach((w,wi)=>{ DAYKEYS.forEach(k=>{ (w.days[k]||[]).forEach(p=>{
      if(p.name.toLowerCase().indexOf(q)===-1) return;
      const o = people[p.name] || (people[p.name] = {dept:p.department, wk:[[],[]]});
      o.wk[wi].push(DAYLONG[k]);
    }); }); });
    const names = Object.keys(people).sort();
    if(!names.length){
      html = '<div class="card"><div class="sub">Nobody matching "' + escH($('findBox').value.trim()) + '" is listed as working from home this week or next week.</div></div>';
    } else {
      html = '<div class="card">' + names.map(n=>{
        const o = people[n];
        const line = (label, arr) => '<div><strong>' + label + ':</strong> ' + (arr.length ? escH(arr.join(', ')) : 'not working from home') + '</div>';
        return '<div style="padding:10px 0; border-bottom:1px solid var(--line);"><div style="font-weight:600;">' + escH(n) + ' <span style="font-weight:400; color:var(--slate-soft); font-size:12.5px;">' + escH(o.dept) + '</span></div>' +
          line('This week (' + escH(weeks[0].label) + ')', o.wk[0]) + line('Next week (' + escH(weeks[1].label) + ')', o.wk[1]) + '</div>';
      }).join('') + '</div>';
    }
    $('whoBody').innerHTML = html; return;
  }
  const w = weeks[WHO_WEEK];
  html += '<div class="weeksw">' +
    '<button class="tab' + (WHO_WEEK===0?' active':'') + '" onclick="WHO_WEEK=0;renderWho()">This week: ' + escH(weeks[0].label) + '</button>' +
    '<button class="tab' + (WHO_WEEK===1?' active':'') + '" onclick="WHO_WEEK=1;renderWho()">Next week: ' + escH(weeks[1].label) + '</button></div>';
  html += '<div class="cols">' + DAYKEYS.map(k=>{
    const list = w.days[k] || [];
    return '<div class="col"><h3>' + DAYLONG[k] + '<span>' + escH(shortDate(addDays(w.weekStart, DAYOFF[k]))) + '</span></h3>' +
      (list.length ? '<ul>' + list.map(p=>'<li>' + escH(p.name) + '<small>' + escH(p.department) + '</small></li>').join('') + '</ul>'
                   : '<div class="none">Nobody has told us they are working from home.</div>') + '</div>';
  }).join('') + '</div>';
  html += '<div class="foot">Only approved requests are shown. People who are not listed have not told us they are working from home. Monday and Friday are office days.</div>';
  $('whoBody').innerHTML = html;
}

/* ---------- apply ---------- */
function setMsg(kind, text){ const m=$('applyMsg'); if(m) m.innerHTML = text ? '<div class="notice ' + kind + ' msg">' + escH(text) + '</div>' : ''; }
function renderApply(){
  const d = DATA, w = d.window, el = $('applyBody');
  if(!d.me.eligible){
    el.innerHTML = '<div class="card"><h2>Apply</h2><div class="notice">Work from home applications are not available for interns. You can still see who is working from home on the first tab.</div></div>';
    return;
  }
  if(!w.open){
    el.innerHTML = '<div class="card"><h2>Applications are closed</h2><div class="sub">Applications are open on Fridays and Mondays only.</div>' +
      '<div class="notice" style="margin-top:12px;">The next window opens on <strong>' + escH(longDate(w.nextOpen)) + '</strong>, for the week of ' + escH(weekLabel(w.nextOpenWeekStart)) + '.</div></div>';
    return;
  }
  const ex = existingFor(w.weekStart);
  const when = dow(w.today)===5 ? 'coming week' : 'this week';
  if(ex){
    el.innerHTML = '<div class="card"><h2>Your request for the ' + when + '</h2><div id="applyMsg"></div><div class="notice ok">You already have a ' + escH(ex.status.toLowerCase()) + ' request for the week of ' + escH(weekLabel(w.weekStart)) + ': ' + escH(ex.days.map(k=>DAYLONG[k]).join(' and ')) + '.</div><div class="sub" style="margin-top:10px;">If you want to change your days, cancel it below and send a new one.</div></div>';
    return;
  }
  el.innerHTML = '<div class="card"><h2>Apply for the ' + when + '</h2>' +
    '<div class="sub">Week of <strong>' + escH(weekLabel(w.weekStart)) + '</strong>. Choose one or two days. Monday and Friday are office days. Your line manager will approve it.</div>' +
    '<div class="daypick" id="daypick">' + DAYKEYS.map(k=>'<label class="dayopt" id="opt-' + k + '"><input type="checkbox" value="' + k + '" onchange="onPick()"><span>' + DAYLONG[k] + '<small>' + escH(shortDate(addDays(w.weekStart,DAYOFF[k]))) + '</small></span></label>').join('') + '</div>' +
    '<div id="applyMsg"></div>' +
    '<button class="btn" id="submitBtn" onclick="submitApply()" disabled>Submit request</button></div>';
}
function picked(){ return Array.from(document.querySelectorAll('#daypick input:checked')).map(i=>i.value); }
function onPick(){
  const p = picked();
  DAYKEYS.forEach(k=>{
    const inp = document.querySelector('#opt-' + k + ' input');
    $('opt-'+k).classList.toggle('on', inp.checked);
    const block = !inp.checked && p.length>=2;
    inp.disabled = block; $('opt-'+k).classList.toggle('off', block);
  });
  $('submitBtn').disabled = !(p.length>=1 && p.length<=2);
}
let SUBMITTING = false;
async function submitApply(){
  if(SUBMITTING) return;
  const days = picked(); const ws = DATA.window.weekStart;
  if(days.length<1 || days.length>2) return setMsg('err','Please choose one or two days.');
  SUBMITTING = true;
  const btn = $('submitBtn'); btn.disabled = true; btn.textContent = 'Submitting...'; setMsg('', '');
  const payload = { action:'wfhApply', email:user.email, hash:user.hash, weekStart:ws, days:days };
  try{
    const res = await fetch(SCRIPT_URL,{ method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify(payload) });
    const out = await res.json().catch(()=>null);
    if(out && out.success===true){
      await refresh(); setMsg('ok','Request submitted. Your manager has been told and you will get a confirmation email.');
    } else if(out && out.success===false){
      setMsg('err', out.message || 'Your request could not be submitted. Please try again.'); btn.disabled=false; btn.textContent='Submit request';
    } else { await confirmOrWarn(ws); }
  }catch(e){ await confirmOrWarn(ws); }
  finally{ SUBMITTING = false; }
}
/* The answer was unreadable. Do NOT send again blindly (that is how double submissions happen): check what the server has. */
async function confirmOrWarn(ws){
  const ok = await refresh();
  if(ok && existingFor(ws)){ setMsg('ok','Request submitted. Your manager has been told and you will get a confirmation email.'); return; }
  const b = $('submitBtn'); if(b){ b.disabled=false; b.textContent='Submit request'; }
  setMsg('err','We could not confirm whether your request was saved. Please check "My requests" below before you try again.');
}

/* ---------- my requests ---------- */
function canCancel(r){
  if(r.status!=='Pending' && r.status!=='Approved') return false;
  const first = Math.min.apply(null, r.days.map(k=>DAYOFF[k]||9));
  return DATA.window.today < addDays(r.weekStart, first);
}
function renderMine(){
  const rows = DATA.mine;
  if(!DATA.me.eligible && !rows.length){ $('mineBody').innerHTML=''; return; }
  $('mineBody').innerHTML = '<div class="card"><h2>My requests</h2>' + (rows.length ?
    '<table><tr><th>Week</th><th>Days</th><th>Status</th><th>Note</th><th></th></tr>' + rows.map(r=>
      '<tr><td>' + escH(weekLabel(r.weekStart)) + '</td><td>' + escH(r.days.map(k=>DAYLONG[k]).join(', ')) + '</td><td><span class="badge b-' + escH(r.status) + '">' + escH(r.status) + '</span></td><td>' + escH(r.managerNote||'') + '</td><td>' +
      (canCancel(r) ? '<button class="btn ghost small" onclick="cancelReq(\'' + escH(r.wfhId) + '\', this)">Cancel</button>' : '') + '</td></tr>').join('') + '</table>'
    : '<div class="sub">You have not sent any requests yet.</div>') + '<div id="mineMsg"></div></div>';
}
async function cancelReq(id, btn){
  if(!confirm('Cancel this work from home request?')) return;
  btn.disabled = true; btn.textContent = 'Cancelling...';
  try{
    const res = await fetch(SCRIPT_URL,{ method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify({ action:'wfhCancel', email:user.email, hash:user.hash, wfhId:id }) });
    const out = await res.json().catch(()=>null);
    if(out && out.success===true){ await refresh(); return; }
    $('mineMsg').innerHTML = '<div class="notice err msg">' + escH((out && out.message) || 'Could not cancel. Please refresh and check.') + '</div>';
  }catch(e){ await refresh(); $('mineMsg').innerHTML = '<div class="notice err msg">We could not confirm the cancellation. Please check the status above.</div>'; }
  btn.disabled = false; btn.textContent = 'Cancel';
}

/* ---------- team (line managers) ---------- */
function renderTeam(){
  if(!DATA.me.isManager){ $('teamBody').innerHTML=''; return; }
  const pend = DATA.team.filter(r=>r.status==='Pending');
  const rest = DATA.team.filter(r=>r.status!=='Pending');
  let html = '<div class="card"><h2>Waiting for your decision</h2>';
  html += pend.length ? pend.map(r=>
    '<div class="req" id="req-' + escH(r.wfhId) + '"><div class="top"><div><strong>' + escH(r.name) + '</strong> <span class="sub">' + escH(r.department) + '</span></div><div>Week of ' + escH(weekLabel(r.weekStart)) + '</div></div>' +
    '<div style="margin-top:6px; font-size:14px;">' + escH(r.days.map(k=>dayDate(r.weekStart,k)).join(', ')) + '</div>' +
    '<textarea rows="2" maxlength="500" placeholder="Optional note to ' + escH(r.name.split(' ')[0]) + '" id="note-' + escH(r.wfhId) + '"></textarea>' +
    '<button class="btn small" onclick="decide(\'' + escH(r.wfhId) + '\',\'Approved\',this)">Approve</button> ' +
    '<button class="btn red small" onclick="decide(\'' + escH(r.wfhId) + '\',\'Declined\',this)">Decline</button><div class="msg" id="rmsg-' + escH(r.wfhId) + '"></div></div>').join('')
    : '<div class="sub">Nothing is waiting for you.</div>';
  html += '</div>';
  if(rest.length){
    html += '<div class="card"><h2>Earlier requests</h2><table><tr><th>Name</th><th>Week</th><th>Days</th><th>Status</th></tr>' + rest.map(r=>
      '<tr><td>' + escH(r.name) + '</td><td>' + escH(weekLabel(r.weekStart)) + '</td><td>' + escH(r.days.map(k=>DAYLONG[k]).join(', ')) + '</td><td><span class="badge b-' + escH(r.status) + '">' + escH(r.status) + '</span></td></tr>').join('') + '</table></div>';
  }
  $('teamBody').innerHTML = html;
}
async function decide(id, status, btn){
  const box = btn.parentElement.querySelectorAll('button'); box.forEach(b=>b.disabled=true);
  const note = ($('note-'+id)||{}).value || '';
  try{
    const res = await fetch(SCRIPT_URL,{ method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify({ action:'wfhDecide', managerEmail:user.email, hash:user.hash, wfhId:id, status:status, managerNote:note }) });
    const out = await res.json().catch(()=>null);
    if(out && out.success===true){ await refresh(); return; }
    $('rmsg-'+id).innerHTML = '<div class="notice err">' + escH((out && out.message) || 'Could not save the decision. Please refresh and check.') + '</div>';
  }catch(e){ await refresh(); const m=$('rmsg-'+id); if(m) m.innerHTML = '<div class="notice err">We could not confirm the decision. Please check the list.</div>'; }
  box.forEach(b=>b.disabled=false);
}

async function initialLoad(){
  const cached = readWfhCache();
  if(cached && !DATA){
    try{ DATA = cached; $('loadMsg').style.display='none'; renderAll(); SHOWED_CACHE = true; }
    catch(e){ DATA = null; SHOWED_CACHE = false; $('loadMsg').style.display=''; $('loadMsg').textContent='Loading...'; }
  } else { $('loadMsg').style.display=''; $('loadMsg').textContent='Loading...'; }
  await refresh();
}
if(user) initialLoad();
</script>
